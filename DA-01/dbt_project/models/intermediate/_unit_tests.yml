version: 2

unit_tests:
  - name: attribution_weights_for_a_multi_touch_path
    description: >
      Path = Paid Social (9 days before), Email (2 days), Direct (1 h), Paid Search (30 min).
      Direct is ignored because other channels exist, so 3 touches: first=1/0/0, last=0/0/1, linear=1/3 each.
    model: int_attribution__paths
    overrides:
      vars: {attribution_lookback_days: 30, time_decay_half_life_days: 7, direct_policy: deprioritize}
    given:
      - input: ref('fct_orders')
        rows:
          - {order_id: O1, person_id: P1, ordered_at: "2020-12-10 12:00:00", order_date: "2020-12-10", net_revenue: 100, is_first_order: true, is_conversion: true, in_tracking_window: true}
          - {order_id: O2, person_id: P2, ordered_at: "2020-12-10 12:00:00", order_date: "2020-12-10", net_revenue: 50, is_first_order: false, is_conversion: true, in_tracking_window: true}
      - input: ref('fct_sessions')
        rows:
          - {session_key: s1, person_id: P1, session_start_ts: "2020-12-01 12:00:00", session_date: "2020-12-01", channel_group: Paid Social, campaign_key: "a", source_system: ga4}
          - {session_key: s2, person_id: P1, session_start_ts: "2020-12-08 12:00:00", session_date: "2020-12-08", channel_group: Email, campaign_key: "b", source_system: ga4}
          - {session_key: s3, person_id: P1, session_start_ts: "2020-12-10 11:00:00", session_date: "2020-12-10", channel_group: Direct, campaign_key: "c", source_system: ga4}
          - {session_key: s4, person_id: P1, session_start_ts: "2020-12-10 11:30:00", session_date: "2020-12-10", channel_group: Paid Search, campaign_key: "d", source_system: segment}
    expect:
      rows:
        - {order_id: O1, session_key: s1, channel_group: Paid Social, touch_position: 1, touch_count: 3, credit_first_touch: 1, credit_last_touch: 0, credit_linear: 0.3333333333333333}
        - {order_id: O1, session_key: s2, channel_group: Email, touch_position: 2, touch_count: 3, credit_first_touch: 0, credit_last_touch: 0, credit_linear: 0.3333333333333333}
        - {order_id: O1, session_key: s4, channel_group: Paid Search, touch_position: 3, touch_count: 3, credit_first_touch: 0, credit_last_touch: 1, credit_linear: 0.3333333333333333}
        - {order_id: O2, session_key: null, channel_group: Unattributed, touch_position: 1, touch_count: 1, credit_first_touch: 1, credit_last_touch: 1, credit_linear: 1}
