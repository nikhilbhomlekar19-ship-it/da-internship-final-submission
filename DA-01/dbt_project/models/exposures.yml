    owner: {name: Marketing Analytics Interns, email: analytics@example.com}
    depends_on:
      - ref('mart_attribution_by_channel')
      - ref('mart_attribution_comparison')
      - ref('mart_campaign_roi')
      - ref('mart_channel_roi')
