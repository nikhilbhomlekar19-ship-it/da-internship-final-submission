  - name: tableau_customer_360
    label: Customer 360 & Segments (Tableau)
    type: dashboard
    maturity: medium
    description: Customer profile, RFM segments, CLV tiers, lifecycle stages.
    owner: {name: Marketing Analytics Interns, email: analytics@example.com}
    depends_on:
      - ref('customer_profile')
      - ref('customer_rfm')
