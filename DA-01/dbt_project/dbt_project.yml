name: customer360
version: "1.0.0"
config-version: 2
profile: customer360

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  # tracking window = date range of the public GA4 sample
  start_date: "2020-11-01"
  end_date: "2021-01-31"
  as_of_date: "2021-01-31"      # "today" for recency / RFM / lifecycle calculations
  use_public_ga4: true          # BigQuery: read bigquery-public-data.ga4_obfuscated_sample_ecommerce
  session_timeout_minutes: 30   # app (Segment) sessionisation gap
  attribution_lookback_days: 30
  time_decay_half_life_days: 7
  direct_policy: deprioritize   # deprioritize = Direct only gets credit if the path has no other channel | include
  gross_margin_pct: 0.45

models:
  customer360:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  customer360:
    +schema: staging
