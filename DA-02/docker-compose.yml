# SQL Server 2022 Developer for local runs. Apple-silicon users: enable "Use Rosetta" in Docker Desktop (image is x86-64).
#   export SA_PASSWORD='YourStrong!Passw0rd'; ./scripts/download_adventureworks.sh; docker compose up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "${SA_PASSWORD:?set SA_PASSWORD}", MSSQL_PID: "Developer" }
    ports: ["1433:1433"]
    volumes: ["./data:/var/opt/mssql/backup:ro", "sqldata:/var/opt/mssql"]
volumes: { sqldata: {} }
